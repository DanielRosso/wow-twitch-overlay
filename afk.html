<!doctype html>
<!--
  AFK-Bildschirm im WoW-Stil für Pausen. Dunkelt das Bild ab, das Spiel bleibt dahinter sichtbar.
  Browserquelle 1920 x 1080 über der Spielaufnahme, bei Bedarf ein- und ausblenden.
  Damit die Zeit beim Einblenden neu startet: in der Quelle
  "Quelle herunterfahren, wenn nicht sichtbar" einschalten.
  Text in config.js (afk). Per URL überschreibbar: channel
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>WoW AFK</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:rgba(0,0,0,.6);font-family:Georgia,serif;color:#fff;text-shadow:2px 2px 0 #000}
.panel{min-width:760px;padding:40px 70px;box-sizing:border-box;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#4a4436,#1b1813 75%);
  border:4px solid #b08d48;border-radius:20px;box-shadow:inset 0 0 0 3px #3a2f1a,inset 0 0 30px #000,0 8px 30px #000c}
.afk{font-size:120px;line-height:1;color:#ffd100}
.who{margin-top:16px;font-size:48px}
.msg{margin-top:14px;font-size:36px;font-style:italic;color:#d9d2bd}
.since{margin-top:26px;font-size:28px;color:#a9a28c}
</style>
</head>
<body>
<div class="panel">
  <div class="afk">&lt;AFK&gt;</div>
  <div class="who" id="who"></div>
  <div class="msg" id="msg"></div>
  <div class="since" id="since"></div>
</div>
<script src="config.js"></script>
<script src="twitch.js"></script>
<script>
const start = Date.now();
document.getElementById('who').textContent = `${CHANNEL} ist abwesend`;
document.getElementById('msg').textContent = CONFIG.afk || 'Bin gleich zurück';
function tick() {
  const s = Math.floor((Date.now() - start) / 1000);
  document.getElementById('since').textContent =
    `Abwesend seit ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
