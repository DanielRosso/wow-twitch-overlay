<!doctype html>
<!--
  Ladebildschirm im WoW-Stil für den Streamstart: Titel, Tipps, Ladebalken mit Countdown.
  Eigene Szene in Streamlabs, Browserquelle 1920 x 1080.
  Damit der Countdown beim Einblenden neu startet: in der Quelle
  "Browser aktualisieren, wenn Szene aktiv wird" einschalten.
  Einstellungen in config.js (title, countdown, tips). Per URL überschreibbar: channel, countdown (Minuten)
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>WoW Ladebildschirm</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{position:relative;font-family:Georgia,serif;color:#fff;text-shadow:2px 2px 0 #000;
  background:radial-gradient(ellipse at 50% 40%,#2b3346 0%,#10141d 55%,#05060a 100%)}
.ring{position:absolute;left:50%;top:40%;width:620px;height:620px;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid #8c744055;box-shadow:0 0 0 18px #8c744018,inset 0 0 120px #8c744030}
.title{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:84px;color:#ffd100}
.channel{position:absolute;left:0;right:0;top:calc(34% + 110px);text-align:center;font-size:32px;color:#d9d2bd}
.tip{position:absolute;left:10%;right:10%;bottom:150px;text-align:center;font-size:30px;line-height:1.4;transition:opacity .6s}
.tip b{color:#ffd100;font-weight:normal}
.time{position:absolute;right:calc(50% - 550px);bottom:112px;font-size:24px;color:#d9d2bd}
.bar{position:absolute;left:50%;bottom:70px;width:1100px;height:28px;transform:translateX(-50%);box-sizing:border-box;
  border:3px solid #8c7440;border-radius:5px;background:#0b0b0b;box-shadow:0 0 0 2px #000,0 4px 16px #000c;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(#f3c55a,#c5832a 55%,#8a4a14);box-shadow:inset 0 1px 0 #ffe9a8}
</style>
</head>
<body>
<div class="ring"></div>
<div class="title" id="title"></div>
<div class="channel" id="channel"></div>
<div class="tip" id="tip"></div>
<div class="time" id="time"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<script src="config.js"></script>
<script src="twitch.js"></script>
<script>
const TOTAL = (params.has('countdown') ? +params.get('countdown') : CONFIG.countdown ?? 5) * 60000;
const TIPS = CONFIG.tips?.length ? CONFIG.tips : ['Gleich geht es los.'];
const start = Date.now();
const $ = id => document.getElementById(id);

$('title').textContent = CONFIG.title || 'Stream startet gleich';
$('channel').textContent = 'twitch.tv/' + CHANNEL;

function tick() {
  const left = Math.max(0, TOTAL - (Date.now() - start));
  $('fill').style.width = (TOTAL ? 100 - left / TOTAL * 100 : 100) + '%';
  const s = Math.ceil(left / 1000);
  $('time').textContent = left ? `Noch ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : 'Gleich geht\'s los!';
}

let i = Math.floor(Math.random() * TIPS.length);
function nextTip() {
  const el = $('tip');
  el.style.opacity = 0;
  setTimeout(() => {
    el.innerHTML = '<b>Tipp:</b> ';
    el.append(TIPS[i++ % TIPS.length]);
    el.style.opacity = 1;
  }, 600);
}

tick();
nextTip();
setInterval(tick, 250);
setInterval(nextTip, 10000);
</script>
</body>
</html>
