<!doctype html>
<!--
  WoW-Schlachtzugswarnung: grosser roter Text in der Bildmitte.
  Auslöser: ein Raid auf deinen Kanal, oder Mods und du schreiben "!rw Text" in den Chat.
  Eigene Browserquelle in Streamlabs, Grösse z. B. 1600 x 220, oben mittig platzieren.
  Per URL überschreibbar: channel, demo=1
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>WoW Schlachtzugswarnung</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;box-sizing:border-box;
  font:bold 48px Georgia,serif;color:#ff4800;text-align:center;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.rw{max-width:95%;margin-bottom:6px;overflow-wrap:anywhere;animation:pop .6s ease-out,out 1s ease-in 9s forwards}
@keyframes pop{0%{transform:scale(1.6);opacity:0}40%{transform:scale(.95);opacity:1}100%{transform:none}}
@keyframes out{to{opacity:0}}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="twitch.js"></script>
<script>
function warn(text) {
  const el = document.createElement('div');
  el.className = 'rw';
  el.textContent = text;
  document.body.append(el);
  while (document.body.querySelectorAll('.rw').length > 2) document.body.querySelector('.rw').remove();
  setTimeout(() => el.remove(), 10000);
}

if (DEMO) {
  const samples = ['Thrall stürmt mit 42 Mitstreitern herein!', 'Alle in Deckung, Boss pullt gleich!', 'Kaffeepause in 5 Minuten'];
  let i = 0;
  warn(samples[i++]);
  setInterval(() => warn(samples[i++ % samples.length]), 6000);
} else {
  connectTwitch(CHANNEL, m => {
    const t = m.tags;
    if (m.cmd === 'USERNOTICE' && t['msg-id'] === 'raid') {
      const name = t['msg-param-displayName'] || t['display-name'];
      warn(`${name} stürmt mit ${t['msg-param-viewerCount'] || 'vielen'} Mitstreitern herein!`);
    } else if (m.cmd === 'PRIVMSG' && /^!rw\s+/i.test(m.text) && ['broadcaster', 'moderator'].includes(roleOf(t))) {
      warn(m.text.replace(/^!rw\s+/i, '').slice(0, 120));
    }
  });
}
</script>
</body>
</html>
